# One pipeline per country so compute and data stay in-country (prod: each in its own
# workspace). The four country blocks are identical apart from the country code.
resources:
  pipelines:
    pos_ph:
      name: pos-ph-medallion-${var.env}
      catalog: pos_ph
      schema: ${var.env}_silver
      serverless: true
      continuous: false
      channel: CURRENT
      photon: true
      root_path: ../pipelines/pos_country
      libraries:
        - glob:
            include: ../pipelines/pos_country/transformations/**
      configuration:
        pos.country: "PH"
        pos.env: ${var.env}
        pos.landing_path: /Volumes/pos_ph/${var.env}_bronze/landing/raw
        spark.sql.session.timeZone: UTC
      tags:
        data_country: "PH"
        component: medallion
        cost_center: retail-data
